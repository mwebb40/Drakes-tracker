name: Daily Drake's tracker run

on:
  schedule:
    # 07:00 UK time. GitHub Actions cron is UTC, so this is 06:00 UTC
    # (07:00 BST in summer will run an hour "early" by clock time — fine
    # for a morning check, adjust if you care about the exact hour).
    - cron: "0 6 * * *"
  workflow_dispatch: {}  # lets you trigger a manual run from the Actions tab

permissions:
  contents: write

jobs:
  run-tracker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tracker
        env:
          EBAY_CLIENT_ID: ${{ secrets.EBAY_CLIENT_ID }}
          EBAY_CLIENT_SECRET: ${{ secrets.EBAY_CLIENT_SECRET }}
        run: python main.py

      - name: Commit updated dashboard + state
        run: |
          git config user.name "drakes-tracker-bot"
          git config user.email "actions@users.noreply.github.com"
          git add docs/index.html data/state.json
          git diff --staged --quiet || git commit -m "Daily update: $(date -u +'%Y-%m-%d')"
          git push
